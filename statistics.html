<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据统计 · 校园公共信息与数据展示中心</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="libs/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="visually-hidden-focusable" href="#main">跳到主要内容</a>

  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top" aria-label="主导航">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">校园公共信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="展开或收起导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="study-rooms.html">自习室</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="statistics.html">数据统计</a></li>
          <li class="nav-item"><a class="nav-link" href="campus-3d.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main id="main" class="container py-4">
    <h1 class="h3 mb-1">自习室使用统计</h1>
    <p class="text-muted" id="stats-meta">正在读取统计数据…</p>

    <!-- 数据加载的三种状态都显示在这里 -->
    <p id="stats-status" class="alert alert-warning" role="status" aria-live="polite" hidden></p>

    <!-- ========== 概览卡片 ========== -->
    <section id="summary" class="mb-4">
      <div class="row g-3" id="summary-cards"></div>
    </section>

    <!-- ========== 图表区 ========== -->
    <section id="charts" class="mb-5">
      <div class="row g-3">
        <div class="col-12 col-xl-7">
          <h2 class="h5">各自习室累计使用量</h2>
          <div id="bar-chart" class="chart-box" role="img"
               aria-label="各自习室累计使用量柱状图：横轴为自习室名称，纵轴为累计人次"></div>
        </div>
        <div class="col-12 col-xl-5">
          <h2 class="h5">各楼栋使用占比</h2>
          <div id="pie-chart" class="chart-box" role="img"
               aria-label="各楼栋累计使用人次占比饼图"></div>
        </div>
        <div class="col-12">
          <h2 class="h5">逐周使用趋势</h2>
          <div class="chart-box">
            <canvas id="line-chart" role="img"
                    aria-label="各楼栋逐周使用人次趋势折线图"></canvas>
          </div>
        </div>
      </div>
    </section>

    <!-- ========== 数据来源 ========== -->
    <section id="data-source" class="mb-5">
      <p class="text-muted small mb-0" id="data-source-line">—</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="mb-1">《软件开发综合实践》期末大作业 · 校园公共信息与数据展示中心</p>
      <p class="mb-0 small">数据来源：课程教学演示数据（非真实统计）</p>
    </div>
  </footer>

  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script src="js/common.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
