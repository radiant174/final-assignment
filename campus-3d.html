<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园三维导览 · 校园公共信息与数据展示中心</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="libs/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="scene-page">
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top" aria-label="主导航">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">校园公共信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="展开或收起导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="study-rooms.html">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="statistics.html">数据统计</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="campus-3d.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 三维画布挂载点，由 js/campus3d.js 插入 canvas -->
  <div class="scene-stage" id="scene-stage"></div>

  <div class="scene-hud">
    <h1 class="h6 mb-2">校园三维导览</h1>
    <p class="mb-2">
      操作：左键拖动旋转，滚轮缩放，右键拖动平移；<b>点击楼栋</b>查看该楼自习室的使用情况。
    </p>

    <!-- 点击楼栋后显示；也可用 campus-3d.html#lib 这样的地址直接定位 -->
    <div id="building-info" class="border-top pt-2" hidden>
      <p class="mb-1 fw-semibold" id="building-name">—</p>
      <p class="mb-2 small text-muted" id="building-stats">—</p>
      <a class="btn btn-sm btn-primary" href="statistics.html">在统计页查看全部数据</a>
    </div>

    <p id="scene-status" class="alert alert-danger mb-0 mt-2" role="status" aria-live="polite" hidden></p>
  </div>

  <footer class="site-footer position-fixed bottom-0 start-0 end-0 mb-0 d-none d-md-block">
    <div class="container text-center small">
      《软件开发综合实践》期末大作业 · 三维场景数据来源：data/rooms.json（教学演示数据）
    </div>
  </footer>

  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/three.min.js"></script>
  <script src="libs/OrbitControls.js"></script>
  <script src="js/common.js"></script>
  <script src="js/campus3d.js"></script>
</body>
</html>
